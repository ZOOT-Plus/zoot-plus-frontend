allowBuilds:
  esbuild: true
  zoot-plus-client@git+https://github.com/ZOOT-Plus/zoot-plus-client-ts.git: true
  zoot-plus-client: true
  zoot-plus-client@https://codeload.github.com/ZOOT-Plus/zoot-plus-client-ts/tar.gz/323e326dcfbc9862e8b984596ea5df255867cb02: true
  nodejieba: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - pinyin-pro@3.29.2

overrides:
  react-rating>@types/react: ^18.0.0
  # Pin two transitive deps to releases that predate the CI minimumReleaseAge
  # cutoff. Newer patches were pulled in by a local pnpm 10 update (which does
  # not enforce the supply-chain policy) and got rejected by CI.
  electron-to-chromium: 1.5.364
  postcss: 8.5.15
